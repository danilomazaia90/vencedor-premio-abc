<style>
:root{--bg:#0d0b0c;--panel:#17140f;--line:#2e2820;--tx:#f5efe8;--mut:#a89b8c;--ac:#e8622c}
*{box-sizing:border-box}

<main>
<header><h1>Post de Vencedor · Prêmio ABC</h1><p>Escolha o prêmio, suba a foto, preencha nome e agência e baixe o feed e o stories juntos.</p></header>
<form id="f" autocomplete="off">
  <div><label for="premio">Prêmio</label><select id="premio"></select></div>

  </div>
  <div><label for="ag">Agência ou empresa</label><input id="ag" maxlength="50" placeholder="ABCCOM"></div>

  <div class="btns">

    <button type="button" id="bPng" class="sec" disabled>Baixar feed e stories (PNG)</button>

</form>

const W=1080;
// medidas tiradas dos PSDs de vencedor; no stories o conteúdo desce 285 px (área segura central)
const NOME={size:95.146,lead:96.792,track:-.01,x:556.5,top:880,b1:970.81,w:460,min:40,f:F.NOME};
const AG={size:27.248,track:.33,x:563.94,y:1129.25,w:452,min:13,f:F.AG};
const FMT={
  feed:{h:1350,dy:0,pre:'',nome:'feed'},
  story:{h:1920,dy:285,pre:'s',nome:'stories'}
};
const $=i=>document.getElementById(i);
const sel=$('premio');
let grupo=null;
PREMIOS.forEach((p,i)=>{if(!grupo||grupo.label!==p.cat){grupo=document.createElement('optgroup');grupo.label=p.cat;sel.append(grupo)}grupo.append(new Option(p.nome,i))});
function img(src){return new Promise((ok,er)=>{const m=new Image();m.onload=()=>ok(m);m.onerror=er;m.src=src})}

function dados(m,h){const v=document.createElement('canvas');v.width=W;v.height=h;const g=v.getContext('2d');g.drawImage(m,0,0);return g.getImageData(0,0,W,h).data}
function camadas(i,k){
  const ch=i+k;if(!cache[ch]){const id=PREMIOS[i].id,f=FMT[k];cache[ch]=Promise.all([img(`img/${id}-${f.pre}k.jpg`),img(`img/${id}-${f.pre}g.png`)]).then(([a,b])=>({k:dados(a,f.h),g:dados(b,f.h)}))}
  return cache[ch];
}
let foto=null;
for(const k in FMT){const f=FMT[k];f.c=$('c-'+k);f.ctx=f.c.getContext('2d');f.st=$('st-'+k);f.z=$('z-'+k);f.zoom=1;f.ox=0;f.oy=0;

function base(f){return Math.max(W/foto.width,f.h/foto.height)}
function limita(f){const s=base(f)*f.zoom,fw=foto.width*s,fh=foto.height*s;f.ox=Math.min(0,Math.max(W-fw,f.ox));f.oy=Math.min(0,Math.max(f.h-fh,f.oy))}
function reenquadra(){if(!foto)return;for(const k in FMT){const f=FMT[k];f.zoom=1;f.z.value=1;const s=base(f);f.ox=(W-foto.width*s)/2;f.oy=0;limita(f)}}
$('foto').addEventListener('change',async e=>{
  const a=e.target.files[0];if(!a)return;
  try{foto=await img(URL.createObjectURL(a))}catch(_){$('av').textContent='Não consegui abrir essa imagem. Tente JPG ou PNG.';return}

});
$('bReset').onclick=()=>{reenquadra();pede()};
for(const k in FMT){const f=FMT[k];let arr=null;
  f.z.addEventListener('input',()=>{if(!foto)return;const cx=W/2,cy=f.h/2,s0=base(f)*f.zoom;f.zoom=+f.z.value;const s1=base(f)*f.zoom;f.ox=cx-(cx-f.ox)*s1/s0;f.oy=cy-(cy-f.oy)*s1/s0;limita(f);pede()});

// texto desenhado pelos contornos da fonte, igual em qualquer navegador
function up(s){return s.trim().replace(/\s+/g,' ').toLocaleUpperCase('pt-BR')}
const paths=new Map();
function path(f,ch){const k=(f===F.NOME?'n':'a')+ch;if(!paths.has(k))paths.set(k,new Path2D(f.g[ch][1]));return paths.get(k)}
function mede(s,b,px){const e=px/b.f.upm,ch=[...s].filter(x=>b.f.g[x]),xs=[];let x=0;
  ch.forEach((q,i)=>{xs.push(x);x+=b.f.g[q][0]*e+((b.f.k[q+(ch[i+1]||'')]||0)*e)+(i<ch.length-1?b.track*px:0)});return{ch,xs,w:x,e}}
function pinta(g,m,b,x,y,cor){g.fillStyle=cor;m.ch.forEach((q,i)=>{g.save();g.translate(x+m.xs[i],y);g.scale(m.e,-m.e);g.fill(path(b.f,q));g.restore()})}
function escreveNome(g,l1,l2,cor,dy){
  if(!l1&&!l2)return{red:false,cabe:true};
  let px=NOME.size;const larg=p=>Math.max(mede(l1,NOME,p).w,mede(l2,NOME,p).w);
  const w=larg(px);if(w>NOME.w)px=Math.max(NOME.min,px*NOME.w/w);
  const k=px/NOME.size,b1=dy+NOME.top+(NOME.b1-NOME.top)*k,b2=b1+NOME.lead*k;
  if(l1)pinta(g,mede(l1,NOME,px),NOME,NOME.x,b1,cor);
  if(l2)pinta(g,mede(l2,NOME,px),NOME,NOME.x,l1?b2:b1,cor);
  return{red:px<NOME.size-.01,cabe:larg(px)<=NOME.w+1};
}
function escreveAg(g,s,dy){
  if(!s)return{red:false,cabe:true};
  let px=AG.size,m=mede(s,AG,px);if(m.w>AG.w){px=Math.max(AG.min,px*AG.w/m.w);m=mede(s,AG,px)}
  pinta(g,m,AG,AG.x,AG.y+dy,'#fff');return{red:px<AG.size-.01,cabe:m.w<=AG.w+1};
}
async function compoe(k){
  const f=FMT[k],L=await camadas(sel.value,k),h=f.h,pg=f.pg;
  pg.fillStyle='#4a4a4a';pg.fillRect(0,0,W,h);
  if(foto){const s=base(f)*f.zoom;pg.drawImage(foto,f.ox,f.oy,foto.width*s,foto.height*s)}
  const P=pg.getImageData(0,0,W,h),p=P.data,K=L.k,G=L.g;
  // peça = arte com foto preta + foto × ganho (máscara, degradê e textos fixos já embutidos)
  for(let i=0;i<p.length;i+=4){const g=G[i]/255;p[i]=K[i]+p[i]*g;p[i+1]=K[i+1]+p[i+1]*g;p[i+2]=K[i+2]+p[i+2]*g;p[i+3]=255}
  return P;
}
let turno=0,pend=false;
function pede(){if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;desenha()})}
async function desenha(){
  const t=++turno,imgs=await Promise.all(Object.keys(FMT).map(compoe));if(t!==turno)return;
  const l1=up($('n1').value),l2=up($('n2').value),ag=up($('ag').value),cor='#'+PREMIOS[sel.value].cor;let a,b;
  Object.keys(FMT).forEach((k,i)=>{const f=FMT[k];f.ctx.putImageData(imgs[i],0,0);a=escreveNome(f.ctx,l1,l2,cor,f.dy);b=escreveAg(f.ctx,ag,f.dy)});
  const ok=!!foto&&!!(l1||l2);$('bJpg').disabled=$('bPng').disabled=!ok;
  $('av').textContent=(!a.cabe||!b.cabe)?'Texto longo demais para caber. Vale abreviar.':(a.red||b.red)?'Reduzimos o tamanho do texto para caber.':!foto?'Falta a foto do vencedor.':'';
}
['input','change'].forEach(ev=>$('f').addEventListener(ev,e=>{if(e.target.id!=='foto')pede()}));
$('f').addEventListener('submit',e=>e.preventDefault());
function limpa(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w -]/g,'').replace(/\s+/g,' ').trim()}
function nomeArq(k){const p=PREMIOS[sel.value],n=[$('n1').value,$('n2').value].join(' ');return limpa(`Vencedor - ${p.arq} - ${n} - ${FMT[k].nome}`)}
function salva(b,nome){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nome;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const blob=(cv,t,q)=>new Promise(r=>cv.toBlob(r,t,q));
async function baixa(t,ext,q){
  await desenha();
  for(const k in FMT){salva(await blob(FMT[k].c,t,q),nomeArq(k)+ext);await new Promise(r=>setTimeout(r,400))}
}
$('bJpg').onclick=()=>baixa('image/jpeg','.jpg',.95);
$('bPng').onclick=()=>baixa('image/png','.png');
desenha();
